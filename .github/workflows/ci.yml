name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install administration and build dependencies
        run: python -m pip install '.[admin]' build
      - name: Build, validate examples, and test
        run: |
          mkdir -p /var/tmp/yamldb-ci
          export TMPDIR=/var/tmp/yamldb-ci
          make all test
          yamldbctl validate --data-dir examples/data
          make sanitizer-test
      - name: Verify Python source and wheel builds
        run: python -m build
