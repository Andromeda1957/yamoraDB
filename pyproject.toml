[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yamldb"
version = "0.1.0"
description = "Python client and administration tools for the native YamlDB document store"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Christian J. Walls"}]

[project.optional-dependencies]
admin = ["PyYAML>=6.0.3,<7"]

[project.scripts]
yamldbctl = "yamldb.yamldbctl:main"

[project.urls]
Repository = "https://github.com/Andromeda1957/yamldb"
Issues = "https://github.com/Andromeda1957/yamldb/issues"

[tool.setuptools]
packages = ["yamldb"]
include-package-data = false

[tool.setuptools.package-data]
yamldb = ["schemas/*.yaml"]
