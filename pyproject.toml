[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yamora"
version = "0.3.0"
description = "YamoraDB: a native document database with a YAML interface and standard-library Python client"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Christian Walls"}]
dependencies = []

[project.optional-dependencies]
admin = ["PyYAML>=6.0.2"]

[project.scripts]
yamoractl = "yamora.yamoractl:main"
yamldbctl = "yamora.yamoractl:main"

[tool.setuptools]
packages = ["yamora", "yamldb"]
package-dir = {yamora = "yamora", yamldb = "yamora/compat"}
include-package-data = false

[tool.setuptools.data-files]
"share/doc/yamora/examples" = ["yamora/drivers/python/examples/crud_tls.py"]
