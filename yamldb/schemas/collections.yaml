# Generic example schema. Supply --schema for your own collections.
schema_version: 1
collections:
  notes:
    kinds:
      note:
        required: [schema_version, kind, id, title, body]
        optional: [tags, metadata]
        types:
          schema_version: integer
          kind: string
          id: string
          title: string
          body: string
          tags: sequence
          metadata: mapping?
